apiVersion: kubescheduler.config.k8s.io/v1
kind: KubeSchedulerConfiguration
leaderElection:
  leaderElect: false
clientConnection:
  kubeconfig: /etc/kubernetes/scheduler.conf
profiles:
  - schedulerName: netmarks-scheduler
    plugins:
      multiPoint:
        enabled:
          - name: NetMarks
            weight: 100
