apiVersion: kubescheduler.config.k8s.io/v1
kind: KubeSchedulerConfiguration

leaderElection:
  leaderElect: false

clientConnection:
  kubeconfig: "REPLACE_ME_WITH_KUBE_CONFIG_PATH"

profiles:
  - schedulerName: scheduler-plugins-scheduler
    plugins:
      multiPoint:
        enabled:
          - name: ArchitectureAware
        disabled:
          - name: "*"
    pluginConfig:
      - name: ArchitectureAware
        args: {}
