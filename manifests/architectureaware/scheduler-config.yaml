apiVersion: kubescheduler.config.k8s.io/v1
kind: KubeSchedulerConfiguration

leaderElection:
  leaderElect: false

clientConnection:
  kubeconfig: ""

profiles:
  - schedulerName: scheduler-plugins-scheduler
    plugins:
      multiPoint:
        enabled:
          - name: ArchitectureAware
        disabled:
          - name: "*"
    pluginConfig:
      - name: ArchitectureAware
        args:
          mappings:
            - labelValue: "nano"
              tag: "latest"
            - labelValue: "orin"
              tag: "r36"
            - labelValue: "xavier"
              tag: "beta"

