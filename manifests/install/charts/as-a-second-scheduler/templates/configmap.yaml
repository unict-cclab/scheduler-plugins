{{- if .Values.plugins.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: scheduler-config
  namespace: {{ .Release.Namespace }}
data:
  scheduler-config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    leaderElection:
      leaderElect: {{ .Values.scheduler.leaderElect }}
    profiles:
    - schedulerName: {{ .Values.scheduler.name }}
      plugins:
        multiPoint:
          enabled:
          {{- range $.Values.plugins.enabled }}
          - name: {{ title . }}
          {{- end }}
          disabled:
          {{- range $.Values.plugins.disabled }}
          - name: {{ title . }}
          {{- end }}
        # -------------------------
        # SCORING PLUGIN SECTION
        # -------------------------
        {{- if .Values.plugins.score }}
        score:
{{ toYaml .Values.plugins.score | nindent 10 }}
        {{- end }}

        # -------------------------
        # QUEUESORT PLUGIN SECTION
        # -------------------------
        {{- if .Values.plugins.queueSort }}
        queueSort:
          enabled:
          {{- range $.Values.plugins.queueSort.enabled }}
          - name: {{ . }}
          {{- end }}
          disabled:
          {{- range $.Values.plugins.queueSort.disabled }}
          - name: {{ title . }}
          {{- end }}
        {{- end }}

      {{- if $.Values.pluginConfig }}
      pluginConfig: {{ toYaml $.Values.pluginConfig | nindent 6 }}
      {{- end }}
  {{- /* TODO: wire CRD installation with enabled plugins. */}}
{{- end }}