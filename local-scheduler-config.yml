apiVersion: kubescheduler.config.k8s.io/v1
kind: KubeSchedulerConfiguration

leaderElection:
  leaderElect: false

clientConnection:
  kubeconfig: /home/angelo/.kube/config

profiles:
- schedulerName: scheduler-plugins-scheduler
  plugins:
    multiPoint:
      enabled:
      - name: NetworkAware
        weight: 1
      - name: LoadAwareResourcesBalancedAllocation
        weight: 1
